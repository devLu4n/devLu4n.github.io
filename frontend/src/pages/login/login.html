<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/white-logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta de candidato ou empresa na plataforma Aladin.">
  <title>Entrar — Aladin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/white-logo.svg">


  <style>
    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(55px);
      pointer-events: none;
      transform: translateZ(0);
    }

    .grain {
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 50%, rgba(17,20,38,.025) 0 1px, transparent 1.5px);
      background-size: 18px 18px, 22px 22px;
      opacity: .35;
      mix-blend-mode: soft-light;
    }

    .glass-card {
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
      border: 1px solid rgba(255,255,255,.88);
      box-shadow: 0 26px 70px rgba(22, 31, 58, .15), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .field {
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(157, 166, 188, .28);
      box-shadow: inset 0 1px 2px rgba(17, 20, 38, .025);
    }

    .field:focus {
      border-color: rgba(255, 107, 11, .72);
      box-shadow: 0 0 0 4px rgba(255, 107, 11, .10);
    }
  </style>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-bgCustom font-sans text-textCustom antialiased">
  <div class="relative min-h-screen overflow-hidden">
    <!-- Fundo inspirado nas referências -->
    <div class="absolute inset-0 bg-[linear-gradient(180deg,#FBFCFF_0%,#F8FAFF_100%)]" aria-hidden="true"></div>
    <div class="blob -left-24 -top-10 h-[330px] w-[330px] bg-blueCustom/55" aria-hidden="true"></div>
    <div class="blob bottom-[-65px] left-[5%] h-[210px] w-[210px] bg-blueCustom/70" aria-hidden="true"></div>
    <div class="blob bottom-[-100px] left-[15%] h-[250px] w-[250px] bg-orangeCustom/75" aria-hidden="true"></div>
    <div class="blob bottom-[-60px] right-[-45px] h-[330px] w-[330px] bg-blueCustom/55" aria-hidden="true"></div>
    <div class="blob bottom-[-95px] right-[-20px] h-[250px] w-[250px] bg-orangeCustom/75" aria-hidden="true"></div>
    <div class="blob left-[49%] top-[51%] h-[255px] w-[255px] bg-orangeCustom/45" aria-hidden="true"></div>
    <div class="grain absolute inset-0" aria-hidden="true"></div>

    <!-- Cabeçalho centralizado -->
    <header class="relative z-20">
      <div class="flex h-[104px] items-center justify-center">
        <a href="/" class="flex items-center gap-2 no-underline transition hover:opacity-80" aria-label="Aladin — página inicial">
          <img src="/assets/aladin-logo.svg" alt="" class="h-10 w-10 object-contain" aria-hidden="true">
          <span class="text-[1.75rem] font-extrabold tracking-tight text-navy">aladin</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="relative z-10 flex min-h-[calc(100vh-104px)] items-start justify-center px-5 pb-12 pt-8 md:pt-10">
      <section class="w-full max-w-[385px]" aria-labelledby="login-title">
        <h1 id="login-title" class="mb-6 text-center text-[2rem] font-extrabold tracking-[-0.03em] text-navy md:text-[2.15rem]">
          Entre na sua conta
        </h1>

        <div class="glass-card rounded-[25px] p-6 md:p-7">
          <!-- Alternância candidato/empresa -->
          <div class="mb-5 grid grid-cols-2 rounded-full bg-[#E8EAF0]/90 p-1.5" role="tablist" aria-label="Tipo de conta">
            <button id="candidate-tab" type="button" role="tab" aria-selected="true" class="rounded-full bg-[linear-gradient(180deg,#FF7A16_0%,#FF6208_100%)] px-3 py-2.5 text-sm font-medium text-white shadow-button transition">
              Sou Candidato
            </button>
            <button id="company-tab" type="button" role="tab" aria-selected="false" class="rounded-full px-3 py-2.5 text-sm font-medium text-navy transition hover:bg-white/50">
              Sou Empresa
            </button>
          </div>

          <form id="login-form" action="/login/candidato" method="post" class="space-y-4">
            <input id="account-type" type="hidden" name="tipo_conta" value="candidato">
            <div>
              <label id="email-label" for="email" class="mb-1.5 block text-[14px] font-medium text-navy">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" required class="field h-[43px] w-full rounded-[11px] px-4 text-sm text-navy outline-none transition placeholder:text-mutedCustom/65" placeholder="voce@exemplo.com">
            </div>

            <div>
              <label for="password" class="mb-1.5 block text-[14px] font-medium text-navy">Senha</label>
              <div class="relative">
                <input id="password" name="password" type="password" autocomplete="current-password" required class="field h-[43px] w-full rounded-[11px] px-4 pr-12 text-sm text-navy outline-none transition placeholder:text-mutedCustom/65" placeholder="Digite sua senha">
                <button id="toggle-password" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-navy/75 transition hover:text-orangeCustom" aria-label="Mostrar senha">
                  <svg id="eye-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg id="eye-closed" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 3 18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2 3"></path>
                    <path d="M6.6 6.6C3.8 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.4-1"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between gap-4 text-[12px]">
              <label class="flex cursor-pointer items-center gap-2 text-mutedCustom">
                <input type="checkbox" class="h-4 w-4 rounded border-slate-300 accent-orangeCustom">
                Lembrar de mim
              </label>
              <a href="#" class="font-medium text-orangeDark transition hover:text-orangeCustom hover:underline">Esqueci minha senha</a>
            </div>

            <button type="submit" class="mt-1 h-[44px] w-full rounded-[10px] bg-[linear-gradient(180deg,#FF7A16_0%,#FF6208_100%)] text-sm font-semibold text-white shadow-button transition hover:-translate-y-0.5 hover:brightness-105 focus:outline-none focus:ring-4 focus:ring-orangeCustom/20">
              Entrar
            </button>
          </form>

          <p class="mt-5 text-center text-[13px] text-navy">
            Não tem uma conta?
            <a id="register-link" href="/src/pages/signup/signup.html?tipo=candidato" class="font-medium text-[#B07835] transition hover:text-orangeCustom hover:underline">Cadastre-se aqui</a>
          </p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const candidateTab = document.getElementById('candidate-tab');
    const companyTab = document.getElementById('company-tab');
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('toggle-password');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');
    const emailLabel = document.getElementById('email-label');
    const emailInput = document.getElementById('email');
    const accountType = document.getElementById('account-type');
    const loginForm = document.getElementById('login-form');
    const registerLink = document.getElementById('register-link');

    const activeTabClasses = 'rounded-full bg-[linear-gradient(180deg,#FF7A16_0%,#FF6208_100%)] px-3 py-2.5 text-sm font-medium text-white shadow-button transition';
    const inactiveTabClasses = 'rounded-full px-3 py-2.5 text-sm font-medium text-navy transition hover:bg-white/50';

    function setAccountType(type, updateUrl = true) {
      const isCandidate = type !== 'empresa';
      const active = isCandidate ? candidateTab : companyTab;
      const inactive = isCandidate ? companyTab : candidateTab;

      active.setAttribute('aria-selected', 'true');
      inactive.setAttribute('aria-selected', 'false');
      active.className = activeTabClasses;
      inactive.className = inactiveTabClasses;

      accountType.value = isCandidate ? 'candidato' : 'empresa';
      emailLabel.textContent = isCandidate ? 'E-mail' : 'E-mail corporativo';
      emailInput.placeholder = isCandidate ? 'voce@exemplo.com' : 'contato@suaempresa.com';
      emailInput.autocomplete = 'email';
      loginForm.action = isCandidate ? '/login/candidato' : '/login/empresa';
      registerLink.href = isCandidate ? '/src/pages/signup/signup.html?tipo=candidato' : '/src/pages/signup/signup.html?tipo=empresa';

      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('tipo', isCandidate ? 'candidato' : 'empresa');
        window.history.replaceState({}, '', url);
      }
    }

    candidateTab.addEventListener('click', () => setAccountType('candidato'));
    companyTab.addEventListener('click', () => setAccountType('empresa'));

    const initialType = new URLSearchParams(window.location.search).get('tipo');
    setAccountType(initialType === 'empresa' ? 'empresa' : 'candidato', false);

    togglePassword.addEventListener('click', () => {
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      eyeOpen.classList.toggle('hidden', isPassword);
      eyeClosed.classList.toggle('hidden', !isPassword);
      togglePassword.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
    });
  </script>
</body>
</html>
