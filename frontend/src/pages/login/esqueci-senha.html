<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Solicite a redefinição da senha da sua conta Aladin.">
  <link rel="icon" type="image/svg+xml" href="/assets/white-logo.svg">
  <title>Esqueci minha senha — Aladin</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-bgCustom font-sans text-textCustom antialiased">
  <div class="relative flex min-h-screen flex-col bg-[linear-gradient(145deg,#F8FAFC_0%,#EFF6FF_48%,#F0F9FF_100%)]">
    <header class="relative z-10">
      <div class="mx-auto flex h-[88px] max-w-[1180px] items-center px-5 md:px-8">
        <a href="/" class="flex items-center gap-2.5" aria-label="Aladin — página inicial">
          <img src="/assets/aladin-logo.svg" alt="" class="h-9 w-9 object-contain" aria-hidden="true">
          <span class="text-xl font-extrabold tracking-tight text-navy">aladin</span>
        </a>
      </div>
    </header>

    <main class="relative z-10 mx-auto grid w-full max-w-[1180px] flex-1 place-items-center px-5 pb-16 md:px-8">
      <section class="w-full max-w-[460px] rounded-3xl border border-white/90 bg-white/70 p-6 shadow-card backdrop-blur-xl md:p-9" aria-labelledby="forgot-title">
        <p class="text-xs font-bold uppercase tracking-[.14em] text-blueCustom">Recuperação de acesso</p>
        <h1 id="forgot-title" class="mt-2 text-3xl font-extrabold tracking-[-.035em] text-navy">Esqueceu sua senha?</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">Informe o e-mail cadastrado para continuar e criar uma nova senha.</p>

        <form id="forgot-password-form" class="mt-7 space-y-4">
          <div>
            <label for="recovery-email" class="mb-1.5 block text-sm font-semibold text-navy">E-mail</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" required class="field h-12 w-full rounded-xl px-4 text-sm outline-none" placeholder="voce@exemplo.com">
          </div>
          <button type="submit" class="motion-interactive h-12 w-full rounded-xl bg-blueCustom text-sm font-bold text-white shadow-button hover:bg-blueDark">Continuar</button>
          <p data-form-feedback class="text-center text-sm font-medium" role="status" aria-live="polite"></p>
        </form>

        <a href="/src/pages/login/login.html" class="mt-5 block text-center text-sm font-semibold text-blueCustom hover:text-blueDark hover:underline">Voltar para o login</a>
      </section>
    </main>
  </div>
</body>
</html>
