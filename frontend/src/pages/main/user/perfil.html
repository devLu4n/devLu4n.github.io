<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <title>Perfil — Aladin</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte e atualize seu perfil profissional no Aladin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(85px);
      pointer-events: none;
      transform: translateZ(0);
      z-index: -2;
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .28;
      background-image:
        radial-gradient(circle at center, rgba(57,117,246,.18) 0 1px, transparent 1.4px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.2));
    }
    .glass-shell {
      background: linear-gradient(145deg, rgba(255,255,255,.58), rgba(255,255,255,.35));
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 30px 80px rgba(22,31,58,.14), inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.48));
      border: 1px solid rgba(255,255,255,.94);
      box-shadow: 0 18px 45px rgba(22,31,58,.09), inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .soft-field {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(161,172,197,.34);
      box-shadow: inset 0 1px 2px rgba(17,20,38,.025);
    }
    .soft-field:focus {
      outline: none;
      border-color: rgba(57,117,246,.75);
      box-shadow: 0 0 0 4px rgba(57,117,246,.10);
    }
    .orange-button {
      background: linear-gradient(180deg,#FF7A16 0%,#FF6208 100%);
      box-shadow: 0 10px 24px rgba(255,107,11,.24);
    }
    .nav-link {
      position: relative;
      color: rgba(17,20,38,.62);
      transition: color .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: #111426; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      height: 2px;
      left: 0;
      right: 0;
      bottom: -9px;
      border-radius: 999px;
      background: linear-gradient(90deg,#3975F6,#FF6B0B);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: .28rem .62rem;
      font-size: .75rem;
      line-height: 1;
      background: rgba(225,230,239,.84);
      color: #111426;
    }
    dialog::backdrop {
      background: rgba(12,17,31,.36);
      backdrop-filter: blur(5px);
    }
    dialog[open] { animation: appear .18s ease-out; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>

  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen bg-[linear-gradient(180deg,#F9FBFF_0%,#F4F8FF_100%)] font-sans text-textCustom antialiased">
  <div class="relative flex min-h-screen flex-col overflow-hidden">
    
<div class="blob -left-20 -top-14 h-[380px] w-[380px] bg-orangeCustom/25" aria-hidden="true"></div>
<div class="blob -right-16 -top-10 h-[410px] w-[410px] bg-blueCustom/28" aria-hidden="true"></div>
<div class="blob -bottom-24 left-[8%] h-[340px] w-[340px] bg-blueCustom/26" aria-hidden="true"></div>
<div class="blob -bottom-20 right-[4%] h-[360px] w-[360px] bg-orangeCustom/25" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

    
<header class="relative z-30">
  <nav class="mx-auto flex min-h-[90px] max-w-[1080px] items-center justify-between gap-6 px-6" aria-label="Navegação principal">
    
<a href="/" class="flex items-center gap-2.5 no-underline" aria-label="Aladin — página inicial">
  <img src="/assets/aladin-logo.svg" alt="" class="h-8 w-8 shrink-0 object-contain" aria-hidden="true" />
  <span class="text-[1.55rem] font-extrabold tracking-tight text-navy">aladin</span>
</a>

    <ul class="hidden items-center gap-10 text-[14px] font-medium md:flex">
      <li><a href="vagas.html" class="nav-link">Vagas</a></li>
      <li><a href="empresas.html" class="nav-link">Empresas</a></li>
      <li><a href="perfil.html" class="nav-link active">Perfil</a></li>
    </ul>
    <div class="relative">
      <button id="profile-menu-button" type="button" class="flex items-center gap-2 rounded-full p-1.5 transition hover:bg-white/50" aria-expanded="false" aria-controls="profile-menu">
        <span class="relative grid h-10 w-10 place-items-center overflow-hidden rounded-full border border-white/80 bg-[linear-gradient(135deg,#DDE8FF,#FFF0E3)] text-sm font-bold text-navy shadow-sm">JS</span>
        <svg class="hidden h-4 w-4 text-navy/70 sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        <span class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full border-2 border-bgCustom bg-orangeCustom"></span>
      </button>
      <div id="profile-menu" class="glass-card absolute right-0 top-14 hidden w-52 rounded-2xl p-2 text-sm shadow-card">
        <a href="perfil.html" class="block rounded-xl px-3 py-2.5 text-navy hover:bg-white/70">Meu perfil</a>
        <a href="/src/pages/main/empresa/painel-empresa.html" class="block rounded-xl px-3 py-2.5 text-navy hover:bg-white/70">Painel empresarial</a>
        <button type="button" class="w-full rounded-xl px-3 py-2.5 text-left text-red-600 hover:bg-red-50">Sair</button>
      </div>
    </div>
  </nav>
</header>

    
<main class="relative z-10 flex-grow px-5 pb-10 pt-3">
  <section class="glass-shell mx-auto max-w-[1080px] rounded-[30px] px-6 py-9 md:px-12 md:py-12" aria-labelledby="profile-title">
    <div class="mx-auto flex max-w-[720px] flex-col items-center text-center">
      <img id="profile-avatar" src="/assets/user.png" alt="Foto de perfil" class="h-44 w-44 rounded-full border-4 border-white/75 object-cover shadow-card">
      <h1 id="profile-title" class="mt-5 text-[2rem] font-extrabold tracking-[-.03em] text-navy">Carregando...</h1>
      <p id="profile-role" class="mt-1 hidden text-base text-navy/85"></p>
      <p id="profile-city" class="mt-2 hidden items-center gap-2 text-sm text-navy/75"><span aria-hidden="true">⌖</span><span></span></p>

      <div class="mt-8 w-full text-left">
        <h2 class="text-base font-bold text-navy">Sobre mim</h2>
        <p id="profile-about" class="mt-2 min-h-5 text-sm leading-relaxed text-navy/85"></p>
        <p id="profile-save-status" class="mt-3 text-sm font-medium" role="status" aria-live="polite"></p>
        <button id="open-profile-modal" class="orange-button mt-7 w-full rounded-xl py-3 text-sm font-semibold text-white transition hover:-translate-y-0.5">
          Editar perfil
        </button>
      </div>
    </div>
  </section>

  <dialog id="profile-modal" class="glass-shell w-[min(92vw,620px)] rounded-[26px] p-0 text-navy">
    <form id="profile-form" class="p-6 md:p-8">
      <div class="flex items-center justify-between gap-5">
        <div>
          <p class="text-xs font-bold uppercase tracking-[.18em] text-orangeCustom">Dados pessoais</p>
          <h2 class="mt-1 text-2xl font-extrabold">Editar perfil</h2>
        </div>
        <button id="close-profile-modal" type="button" class="grid h-10 w-10 place-items-center rounded-full bg-white/60 text-xl hover:bg-white" aria-label="Fechar">×</button>
      </div>
      <div class="mt-6 grid gap-4 md:grid-cols-2">
        <label class="text-sm font-semibold md:col-span-2">Foto de perfil
          <input id="profile-photo-input" type="file" accept="image/*" class="soft-field mt-2 w-full rounded-xl px-4 py-3 text-sm text-navy" />
          <p class="mt-2 text-xs text-mutedCustom">Selecione uma imagem para o seu perfil. Se não houver foto, será usada a imagem padrão.</p>
        </label>
        <label class="text-sm font-semibold">Nome
          <input id="edit-name" name="nome" readonly class="soft-field mt-2 h-12 w-full cursor-not-allowed rounded-xl px-4 font-normal opacity-75">
        </label>
        <label class="text-sm font-semibold">Cargo
          <input id="edit-role" name="cargo" class="soft-field mt-2 h-12 w-full rounded-xl px-4 font-normal" placeholder="Ex.: Desenvolvedor Front-end">
        </label>
        <label class="text-sm font-semibold">Cidade
          <input id="edit-city" name="cidade" class="soft-field mt-2 h-12 w-full rounded-xl px-4 font-normal" placeholder="Ex.: Maceió, AL">
        </label>
        <label class="text-sm font-semibold">E-mail
          <input id="edit-email" name="email" type="email" readonly class="soft-field mt-2 h-12 w-full cursor-not-allowed rounded-xl px-4 font-normal opacity-75">
        </label>
        <label class="text-sm font-semibold md:col-span-2">Sobre mim
          <textarea id="edit-about" name="bio" class="soft-field mt-2 min-h-28 w-full rounded-xl px-4 py-3 font-normal" placeholder="Conte um pouco sobre você"></textarea>
        </label>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button id="cancel-profile" type="button" class="rounded-xl border border-navy/15 bg-white/60 px-5 py-3 text-sm font-semibold">Cancelar</button>
        <button type="submit" class="orange-button rounded-xl px-5 py-3 text-sm font-semibold text-white">Salvar alterações</button>
      </div>
    </form>
  </dialog>
</main>

    
<footer class="relative z-10 mt-auto px-6 py-7">
  <div class="mx-auto flex max-w-[1080px] flex-col items-center justify-between gap-3 border-t border-white/80 pt-5 text-center text-[12px] text-mutedCustom sm:flex-row sm:text-left">
    <p>© 2026 Aladin. Todos os direitos reservados.</p>
    <nav class="flex items-center gap-5" aria-label="Links do rodapé">
      <a href="#" class="transition hover:text-navy">Privacidade</a>
      <a href="#" class="transition hover:text-navy">Termos</a>
      <a href="#" class="transition hover:text-navy">Contato</a>
    </nav>
  </div>
</footer>

  </div>
  
<script>
  const profileMenuButton = document.getElementById('profile-menu-button');
  const profileMenu = document.getElementById('profile-menu');
  if (profileMenuButton && profileMenu) {
    profileMenuButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const willOpen = profileMenu.classList.contains('hidden');
      profileMenu.classList.toggle('hidden');
      profileMenuButton.setAttribute('aria-expanded', String(willOpen));
    });
    document.addEventListener('click', (event) => {
      if (!profileMenu.contains(event.target) && !profileMenuButton.contains(event.target)) {
        profileMenu.classList.add('hidden');
        profileMenuButton.setAttribute('aria-expanded', 'false');
      }
    });
  }
</script>

  
<script>
  const profileModal = document.getElementById('profile-modal');
  document.getElementById('open-profile-modal').addEventListener('click', () => profileModal.showModal());
  document.getElementById('close-profile-modal').addEventListener('click', () => profileModal.close());
  document.getElementById('cancel-profile').addEventListener('click', () => profileModal.close());

</script>

</body>
</html>
