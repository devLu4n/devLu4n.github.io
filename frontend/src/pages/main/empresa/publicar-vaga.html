<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <title>Publicar nova vaga — Aladin</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Publique uma nova oportunidade de tecnologia na plataforma Aladin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; }
    .blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(85px);
      pointer-events: none;
      transform: translateZ(0);
      z-index: -2;
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .28;
      background-image: radial-gradient(circle at center, rgba(57,117,246,.18) 0 1px, transparent 1.4px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.2));
    }
    .glass-shell {
      background: linear-gradient(145deg, rgba(255,255,255,.60), rgba(255,255,255,.37));
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: 0 30px 80px rgba(22,31,58,.14), inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.50));
      border: 1px solid rgba(255,255,255,.96);
      box-shadow: 0 18px 45px rgba(22,31,58,.09), inset 0 1px 0 rgba(255,255,255,.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .soft-field {
      background: rgba(255,255,255,.80);
      border: 1px solid rgba(123,137,166,.32);
      box-shadow: inset 0 1px 2px rgba(17,20,38,.025);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .soft-field:focus {
      outline: none;
      border-color: rgba(57,117,246,.78);
      box-shadow: 0 0 0 4px rgba(57,117,246,.10);
    }
    .orange-button {
      background: linear-gradient(180deg,#FF7A16 0%,#FF6208 100%);
      box-shadow: 0 10px 24px rgba(255,107,11,.24);
    }
    .orange-button:hover { filter: brightness(.98); }
    .nav-link {
      position: relative;
      color: rgba(17,20,38,.62);
      transition: color .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: #111426; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      height: 2px;
      left: 0;
      right: 0;
      bottom: -9px;
      border-radius: 999px;
      background: linear-gradient(90deg,#3975F6,#FF6B0B);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: .32rem .72rem;
      font-size: .75rem;
      line-height: 1;
      border: 1px solid rgba(57,117,246,.4);
      background: rgba(255,255,255,.54);
      color: #111426;
    }
    dialog::backdrop {
      background: rgba(12,17,31,.36);
      backdrop-filter: blur(5px);
    }
    dialog[open] { animation: appear .18s ease-out; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .affinity-ring {
      --score: 92;
      width: 112px;
      height: 112px;
      border-radius: 9999px;
      display: grid;
      place-items: center;
      background: conic-gradient(#FF6B0B calc(var(--score) * 1%), rgba(255,107,11,.14) 0);
      box-shadow: 0 10px 30px rgba(255,107,11,.14);
      position: relative;
      flex-shrink: 0;
    }
    .affinity-ring::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: inherit;
      background: rgba(249,251,255,.96);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.9);
    }
    .affinity-content { position: relative; z-index: 1; text-align: center; }
    .toast {
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.hidden-toast {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
  </style>

  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen bg-[linear-gradient(180deg,#F9FBFF_0%,#F4F8FF_100%)] font-sans text-textCustom antialiased">
  <div class="relative flex min-h-screen flex-col overflow-hidden">
    
<div class="blob -left-20 -top-14 h-[380px] w-[380px] bg-orangeCustom/25" aria-hidden="true"></div>
<div class="blob -right-16 -top-10 h-[410px] w-[410px] bg-blueCustom/28" aria-hidden="true"></div>
<div class="blob -bottom-24 left-[8%] h-[340px] w-[340px] bg-blueCustom/26" aria-hidden="true"></div>
<div class="blob -bottom-20 right-[4%] h-[360px] w-[360px] bg-orangeCustom/25" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

    
<header class="relative z-30">
  <nav class="mx-auto flex min-h-[90px] max-w-[1080px] items-center justify-between gap-6 px-6" aria-label="Navegação principal">
    
<a href="/" class="flex items-center gap-2.5 no-underline" aria-label="Aladin — página inicial">
  <img src="/assets/aladin-logo.svg" alt="" class="h-8 w-8 shrink-0 object-contain" aria-hidden="true" />
  <span class="text-[1.55rem] font-extrabold tracking-tight text-navy">aladin</span>
</a>

    <ul class="hidden items-center gap-10 text-[14px] font-medium md:flex">
      <li><a href="/src/pages/main/user/gerenciar-vagas.html" class="nav-link active">Vagas</a></li>
      <li><a href="/src/pages/main/user/perfil.html" class="nav-link">Perfil</a></li>
    </ul>
    <div class="relative">
      <button id="profile-menu-button" type="button" class="flex items-center gap-2 rounded-full p-1.5 transition hover:bg-white/50" aria-expanded="false" aria-controls="profile-menu">
        <span class="relative grid h-10 w-10 place-items-center overflow-hidden rounded-full border border-white/80 bg-[linear-gradient(135deg,#DDE8FF,#FFF0E3)] text-sm font-bold text-navy shadow-sm">JS</span>
        <svg class="hidden h-4 w-4 text-navy/70 sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        <span class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full border-2 border-bgCustom bg-orangeCustom"></span>
      </button>
      <div id="profile-menu" class="glass-card absolute right-0 top-14 hidden w-52 rounded-2xl p-2 text-sm shadow-card">
        <a href="/src/pages/main/user/perfil.html" class="block rounded-xl px-3 py-2.5 text-navy hover:bg-white/70">Meu perfil</a>
        <a href="painel-empresa.html" class="block rounded-xl px-3 py-2.5 text-navy hover:bg-white/70">Painel empresarial</a>
        <button type="button" class="w-full rounded-xl px-3 py-2.5 text-left text-red-600 hover:bg-red-50">Sair</button>
      </div>
    </div>
  </nav>
</header>


    <main class="relative z-10 flex-grow px-5 pb-10 pt-3">
      <section class="glass-shell mx-auto max-w-[1080px] rounded-[30px] px-5 py-7 md:px-12 md:py-10" aria-labelledby="nova-vaga-title">
        <div class="mx-auto max-w-[720px]">
          <a href="painel-empresa.html" class="text-xs font-semibold text-blueCustom hover:underline">← Voltar ao painel</a>
          <h1 id="nova-vaga-title" class="mt-2 text-[clamp(1.8rem,4vw,2.5rem)] font-extrabold tracking-[-.03em] text-navy">
            Publicar Nova Vaga
          </h1>

          <form id="vacancy-form" class="mt-7 grid gap-x-5 gap-y-4 md:grid-cols-2" novalidate>
            <label class="text-sm font-semibold text-navy">
              Título da vaga
              <input id="job-title" name="titulo" required class="soft-field mt-2 h-12 w-full rounded-xl px-4 font-normal" placeholder="Ex.: Desenvolvedor Front-end">
              <span class="field-error mt-1 hidden text-xs font-normal text-red-600">Informe o título da vaga.</span>
            </label>

            <label class="text-sm font-semibold text-navy">
              Área
              <select id="job-area" name="area" required class="soft-field mt-2 h-12 w-full rounded-xl px-4 font-normal">
                <option value="">Selecione uma área</option>
                <option>Tecnologia</option>
                <option>Design</option>
                <option>Marketing</option>
                <option>Dados</option>
                <option>Produto</option>
              </select>
              <span class="field-error mt-1 hidden text-xs font-normal text-red-600">Selecione a área.</span>
            </label>

            <label class="text-sm font-semibold text-navy">
              Descrição
              <textarea id="job-description" name="descricao" required class="soft-field mt-2 min-h-[130px] w-full resize-y rounded-xl px-4 py-3 font-normal" placeholder="Descreva as responsabilidades e requisitos da vaga..."></textarea>
              <span class="field-error mt-1 hidden text-xs font-normal text-red-600">Descreva a oportunidade.</span>
            </label>

            <div class="grid content-start gap-4">
              <label class="text-sm font-semibold text-navy">
                Cidade
                <input id="job-city" name="cidade" required class="soft-field mt-2 h-12 w-full rounded-xl px-4 font-normal" placeholder="Ex.: Maceió, AL">
                <span class="field-error mt-1 hidden text-xs font-normal text-red-600">Informe a cidade.</span>
              </label>

              <label class="text-sm font-semibold text-navy">
                Salário
                <span class="soft-field mt-2 flex h-12 overflow-hidden rounded-xl">
                  <span class="grid w-14 shrink-0 place-items-center border-r border-lineCustom/70 bg-white/45 text-sm font-medium">R$</span>
                  <input id="job-salary" name="salario" inputmode="decimal" class="min-w-0 flex-1 bg-transparent px-4 font-normal outline-none" placeholder="Ex.: 5.000,00">
                </span>
              </label>
            </div>

            <fieldset class="md:col-span-2">
              <legend class="text-sm font-semibold text-navy">Modalidade</legend>
              <div class="mt-3 flex flex-wrap gap-x-6 gap-y-3">
                <label class="flex cursor-pointer items-center gap-2 text-sm">
                  <input type="radio" name="modalidade" value="Presencial" checked class="h-4 w-4 accent-blueCustom"> Presencial
                </label>
                <label class="flex cursor-pointer items-center gap-2 text-sm">
                  <input type="radio" name="modalidade" value="Remoto" class="h-4 w-4 accent-blueCustom"> Remoto
                </label>
                <label class="flex cursor-pointer items-center gap-2 text-sm">
                  <input type="radio" name="modalidade" value="Híbrido" class="h-4 w-4 accent-blueCustom"> Híbrido
                </label>
              </div>
            </fieldset>

            <div class="md:col-span-2">
              <label for="technology-input" class="text-sm font-semibold text-navy">Tecnologias</label>
              <div id="technology-box" class="soft-field mt-2 flex min-h-12 flex-wrap items-center gap-2 rounded-xl px-3 py-2">
                <div id="technology-chips" class="contents"></div>
                <input id="technology-input" class="min-w-[150px] flex-1 bg-transparent py-1 text-sm font-normal outline-none" placeholder="Digite e pressione Enter">
              </div>
              <p class="mt-1 text-xs text-mutedCustom">Use Enter ou vírgula para adicionar. Clique no × para remover.</p>
            </div>

            <div class="mt-2 flex flex-col-reverse gap-3 md:col-span-2 sm:flex-row sm:justify-end">
              <button id="save-draft" type="button" class="rounded-xl border border-navy/18 bg-white/45 px-6 py-3 text-sm font-semibold text-navy transition hover:bg-white/70">
                Salvar rascunho
              </button>
              <button type="submit" class="orange-button rounded-xl px-8 py-3 text-sm font-semibold text-white transition hover:-translate-y-0.5">
                Publicar Vaga
              </button>
            </div>
          </form>
        </div>
      </section>

      <div id="vacancy-toast" class="toast hidden-toast fixed bottom-6 right-6 z-50 max-w-sm rounded-2xl bg-navy px-5 py-4 text-sm font-semibold text-white shadow-card">
        Vaga publicada com sucesso.
      </div>
    </main>

    
<footer class="relative z-10 mt-auto px-6 py-7">
  <div class="mx-auto flex max-w-[1080px] flex-col items-center justify-between gap-3 border-t border-white/80 pt-5 text-center text-[12px] text-mutedCustom sm:flex-row sm:text-left">
    <p>© 2026 Aladin. Todos os direitos reservados.</p>

      <a href="#" class="transition hover:text-navy">Privacidade</a>
      <a href="#" class="transition hover:text-navy">Termos</a>
      <a href="#" class="transition hover:text-navy">Contato</a>
    </nav>
  </div>
</footer>

  </div>

  
<script>
  const profileMenuButton = document.getElementById('profile-menu-button');
  const profileMenu = document.getElementById('profile-menu');

  if (profileMenuButton && profileMenu) {
    profileMenuButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const willOpen = profileMenu.classList.contains('hidden');
      profileMenu.classList.toggle('hidden');
      profileMenuButton.setAttribute('aria-expanded', String(willOpen));
    });

    document.addEventListener('click', (event) => {
      if (!profileMenu.contains(event.target) && !profileMenuButton.contains(event.target)) {
        profileMenu.classList.add('hidden');
        profileMenuButton.setAttribute('aria-expanded', 'false');
      }
    });
  }
</script>

  <script>
    const vacancyForm = document.getElementById('vacancy-form');
    const technologyInput = document.getElementById('technology-input');
    const technologyChips = document.getElementById('technology-chips');
    const vacancyToast = document.getElementById('vacancy-toast');
    const technologies = ['React', 'Node.js'];

    function showToast(message) {
      vacancyToast.textContent = message;
      vacancyToast.classList.remove('hidden-toast');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => vacancyToast.classList.add('hidden-toast'), 2600);
    }

    function renderTechnologies() {
      technologyChips.innerHTML = '';
      technologies.forEach((technology, index) => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1 rounded-full bg-slate-200/80 px-3 py-1.5 text-xs font-medium text-navy';
        const label = document.createElement('span');
        label.textContent = technology;

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'text-navy/45 hover:text-red-600';
        removeButton.setAttribute('aria-label', `Remover ${technology}`);
        removeButton.textContent = '×';
        removeButton.addEventListener('click', () => {
          technologies.splice(index, 1);
          renderTechnologies();
        });

        chip.append(label, removeButton);
        technologyChips.appendChild(chip);
      });
    }

    function addTechnology(rawValue) {
      const technology = rawValue.trim().replace(/,$/, '');
      if (!technology) return;
      const exists = technologies.some(item => item.toLowerCase() === technology.toLowerCase());
      if (!exists) technologies.push(technology);
      technologyInput.value = '';
      renderTechnologies();
    }

    technologyInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ',') {
        event.preventDefault();
        addTechnology(technologyInput.value);
      }
    });

    technologyInput.addEventListener('blur', () => addTechnology(technologyInput.value));

    function validateRequiredField(field) {
      const label = field.closest('label');
      const error = label?.querySelector('.field-error');
      const valid = Boolean(field.value.trim());
      field.classList.toggle('border-red-500', !valid);
      error?.classList.toggle('hidden', valid);
      return valid;
    }

    ['job-title', 'job-area', 'job-description', 'job-city'].forEach(id => {
      const field = document.getElementById(id);
      field.addEventListener('input', () => validateRequiredField(field));
      field.addEventListener('change', () => validateRequiredField(field));
    });

    vacancyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const requiredFields = ['job-title', 'job-area', 'job-description', 'job-city'].map(id => document.getElementById(id));
      const valid = requiredFields.map(validateRequiredField).every(Boolean);

      if (!valid) {
        requiredFields.find(field => !field.value.trim())?.focus();
        return;
      }

      const salaryValue = document.getElementById('job-salary').value
        .trim()
        .replace(/\./g, '')
        .replace(',', '.');
      const salary = salaryValue ? Math.round(Number(salaryValue)) : null;

      if (salaryValue && !Number.isFinite(salary)) {
        showToast('Informe uma faixa salarial válida.');
        document.getElementById('job-salary').focus();
        return;
      }

      const payload = {
        titulo: document.getElementById('job-title').value.trim(),
        area: document.getElementById('job-area').value,
        descricao: document.getElementById('job-description').value.trim(),
        cidade: document.getElementById('job-city').value.trim(),
        salarioMin: salary,
        modalidade: new FormData(vacancyForm).get('modalidade'),
        tecnologias: technologies.join(', ')
      };

      try {
        await window.aladinApi.request('/vagas', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast('Vaga publicada com sucesso.');
        localStorage.removeItem('aladin-vaga-rascunho');
        vacancyForm.reset();
        technologies.splice(0, technologies.length, 'React', 'Node.js');
        renderTechnologies();
        window.setTimeout(() => {
          window.location.href = '/src/pages/main/user/gerenciar-vagas.html';
        }, 700);
      } catch (error) {
        showToast(error.message);
      }
    });

    document.getElementById('save-draft').addEventListener('click', () => {
      const draft = {
        titulo: document.getElementById('job-title').value,
        area: document.getElementById('job-area').value,
        descricao: document.getElementById('job-description').value,
        cidade: document.getElementById('job-city').value,
        salario: document.getElementById('job-salary').value,
        modalidade: new FormData(vacancyForm).get('modalidade'),
        tecnologias
      };
      localStorage.setItem('aladin-vaga-rascunho', JSON.stringify(draft));
      showToast('Rascunho salvo neste navegador.');
    });

    const savedDraft = localStorage.getItem('aladin-vaga-rascunho');
    if (savedDraft) {
      try {
        const draft = JSON.parse(savedDraft);
        document.getElementById('job-title').value = draft.titulo || '';
        document.getElementById('job-area').value = draft.area || '';
        document.getElementById('job-description').value = draft.descricao || '';
        document.getElementById('job-city').value = draft.cidade || '';
        document.getElementById('job-salary').value = draft.salario || '';
        if (Array.isArray(draft.tecnologias) && draft.tecnologias.length) {
          technologies.splice(0, technologies.length, ...draft.tecnologias);
        }
        const mode = document.querySelector(`input[name="modalidade"][value="${draft.modalidade}"]`);
        if (mode) mode.checked = true;
      } catch (error) {
        console.warn('Não foi possível carregar o rascunho.', error);
      }
    }

    renderTechnologies();
  </script>
</body>
