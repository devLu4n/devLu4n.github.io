name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: aladin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, build e imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: backend

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Executar testes
        run: npm test -- --runInBand
        working-directory: backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}

      - name: Preparar artefato do GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Enviar artefato do GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Validar imagem Docker
        run: docker build --tag aladin:${{ github.sha }} .

  pages:
    name: Publicar frontend no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Publicar no Amazon ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Autenticar na AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Entrar no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar e publicar imagem
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build --tag "$IMAGE" --tag "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Obter definição atual da tarefa
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Atualizar imagem da tarefa
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          jq --arg IMAGE "$IMAGE" --arg NAME "$ECS_CONTAINER_NAME" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)' \
            task-definition.json > task-definition-next.json

      - name: Registrar tarefa e atualizar serviço
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
