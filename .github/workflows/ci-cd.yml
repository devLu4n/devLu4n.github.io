name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: aladin-${{ github.ref }}
  # Não cancele uma publicação que já possa ter sido aceita pelo Pages.
  # Execuções da mesma branch aguardam a anterior terminar.
  cancel-in-progress: false

jobs:
  quality:
    name: Testes, build e imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: backend

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Executar testes
        run: npm test -- --runInBand
        working-directory: backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend

      - name: Validar imagem Docker
        run: docker build --tag aladin:${{ github.sha }} .

      - name: Validar imagem da Lambda
        run: docker build --file Dockerfile.lambda --tag aladin-lambda:${{ github.sha }} .

  pages_build:
    name: Compilar frontend para o GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  pages:
    name: Publicar frontend no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages_build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # O padrão da action é 10 minutos, insuficiente quando o serviço
          # permanece em deployment_queued. Este valor permite esperar 30 min.
          timeout: 1800000
          reporting_interval: 10000
          error_count: 20

  deploy_api:
    name: Publicar API serverless na AWS
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Autenticar na AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Compilar aplicação serverless
        run: sam build

      - name: Publicar stack
        run: >-
          sam deploy
          --stack-name aladin-api
          --region "$AWS_REGION"
          --resolve-s3
          --resolve-image-repos
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --capabilities CAPABILITY_IAM
          --parameter-overrides
          "AllowedOrigin=${{ vars.FRONTEND_ORIGIN }}"
          "ApplicationSecretArn=${{ vars.APPLICATION_SECRET_ARN }}"
          "LambdaSubnetIds=${{ vars.LAMBDA_SUBNET_IDS }}"
          "LambdaSecurityGroupIds=${{ vars.LAMBDA_SECURITY_GROUP_IDS }}"
