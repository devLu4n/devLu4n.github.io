<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato - Oxetech</title>
</head>

<body>

    <header>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#contato" aria-current="page">Contato</a></li>
            </ul>
            <button type="button" aria-label="Entrar em contato">Let's Talk</button>
        </nav>
    </header>

    <main id="contato">

        <hr>

        <section aria-labelledby="contato-title">
            <h1 id="contato-title">Formulário de Contato</h1>
            <p>Preencha os campos abaixo para entrar em contato.</p>
        </section>

        <hr>

        <form method="post" action="#">

            <fieldset>
                <legend>Dados Pessoais</legend>

                <p>
                    <label for="nome">Nome:</label><br>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        minlength="3"
                        maxlength="100"
                        placeholder="Seu nome completo"
                    >
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="seu@email.com"
                    >
                </p>

                <p>
                    <label for="senha">Senha:</label><br>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        minlength="6"
                        maxlength="20"
                        placeholder="Mínimo 6 caracteres"
                    >
                </p>

                <p>
                    <label for="nascimento">Data de Nascimento:</label><br>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >
                </p>

            </fieldset>

            <br>

            <fieldset>
                <legend>Assunto</legend>

                <p>
                    <input type="radio" id="assunto-duvida" name="assunto" value="duvida" required>
                    <label for="assunto-duvida">Dúvida</label>
                </p>
                <p>
                    <input type="radio" id="assunto-sugestao" name="assunto" value="sugestao">
                    <label for="assunto-sugestao">Sugestão</label>
                </p>
                <p>
                    <input type="radio" id="assunto-outro" name="assunto" value="outro">
                    <label for="assunto-outro">Outro</label>
                </p>

            </fieldset>

            <br>

            <fieldset>
                <legend>Termos</legend>

                <p>
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Aceito os termos e condições</label>
                </p>

            </fieldset>

            <br>

            <button type="submit">Enviar</button>

        </form>

        <hr>

        <footer>
            <p>Aula do Morrissey.</p>
        </footer>

    </main>

</body>

</html>
